name: Deploy Develop API

on:
  # IF NEEDED, CONFIGURE CI BEFORE CD
  # workflow_run:
  #   workflows: ["CI pipeline for the API"]
  #   types:
  #     - completed
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Docker image
        run: docker build -t antoinespr/association-adonf-api:dev1 ./Association-Adonf-API

      - name: Push image to Docker Hub
        run: docker push antoinespr/association-adonf-api:dev1

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            docker pull antoinespr/association-adonf-api:dev1
            docker compose -f /home/ubuntu/backend/docker-compose.yml up -d --force-recreate
